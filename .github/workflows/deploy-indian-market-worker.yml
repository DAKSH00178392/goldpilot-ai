name: Deploy Indian Market Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - indian_market_worker/**
      - .github/workflows/deploy-indian-market-worker.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: indian_market_worker
          command: deploy
